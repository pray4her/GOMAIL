  /api/v1/statistics:
    get:
      description: |-
        Get comprehensive email sending statistics with various filters and grouping options.
        Provides overall summary, time series data, and sender performance analysis.
      parameters:
      - description: Start date (YYYY-MM-DD format)
        example: "2023-10-01"
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD format)
        example: "2023-10-31"
        in: query
        name: end_date
        type: string
      - description: Filter by specific account ID
        example: 1
        in: query
        name: account_id
        type: integer
      - description: Filter by specific sender ID
        example: 1
        in: query
        name: account_sender_id
        type: integer
      - description: 'Group results by: day, week, month, sender'
        enum:
        - day
        - week
        - month
        - sender
        example: day
        in: query
        name: group_by
        type: string
